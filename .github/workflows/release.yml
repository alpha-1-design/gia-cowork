name: Build & Release (Linux)

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*.*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: Build .deb / .AppImage / .rpm
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config

      - run: npm ci --legacy-peer-deps

      # tauri-action builds the frontend itself (via beforeBuildCommand in
      # tauri.conf.json) and produces .deb/.AppImage/.rpm per the
      # bundle.targets list in tauri.conf.json.
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "GIA Cowork ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false

      # workflow_dispatch / plain branch pushes don't have a tag for
      # tauri-action to attach a release to -- upload the raw bundle
      # artifacts instead so every build is downloadable, not just tags.
      - name: Upload build artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: gia-cowork-linux-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: warn
